<!DOCTYPE html>
<html lang="en">

<head>
    <title>Contact The Pet Shop</title>
    <meta charset="UTF-8">

    <meta name="description"
        content="Contact The Pet Shop with questions about pets, services, and our monthly newsletter.">
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
    </nav>

    <!-- HEADER -->
    <header>
        <div>
            <h1>Contact Us!</h1>
        </div>
    </header>

    <!-- CONTACT FORM -->
    <section>

        <h3>
            Please provide your contact information
            and a brief message of your inquiry.
        </h3>

        <div>

            <form>

                <input
                    type="text"
                    placeholder="First Name">

                <input
                    type="text"
                    placeholder="Last Name">

                <br>

                <input
                    type="email"
                    placeholder="Email">

                <br>

                <input
                    type="tel"
                    placeholder="Phone Number">

                <br>

                <input
                    type="checkbox"
                    id="newsletter">

                <label for="newsletter">
                    Would you like to receive our monthly newsletter?
                </label>

                <br>

                <textarea
                    placeholder="Type message here..."></textarea>

                <br>

                <input
                    type="submit"
                    value="Submit">

            </form>

        </div>

    </section>

    <!-- FOOTER -->
    <footer>

        <table>

            <tr>

                <td>
                    <p>The Pet Shop! &copy;</p>
                </td>

                <td>
                    <p>123 Square Ave</p>
                    <p>Portland, OR 97204</p>
                </td>

                <td>
                    <p>503-234-3966</p>
                </td>

            </tr>

        </table>

    </footer>

</body>

</html>
